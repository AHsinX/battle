<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>循環系統大決戰！</title>
    <style>
        :root {
            --primary: #FF5A5F;
            --secondary: #00A699;
            --bg-color: #F7F7F7;
            --text-main: #484848;
            --white: #FFFFFF;
            --hp-green: #2ecc71;
            --hp-red: #e74c3c;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #author-tag {
            position: fixed;
            top: 10px;
            right: 10px;
            font-size: 12px;
            color: #888;
            z-index: 1000;
            background: rgba(255,255,255,0.7);
            padding: 4px 8px;
            border-radius: 10px;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .input-box {
            font-size: 1.5rem;
            padding: 15px;
            border: 3px solid var(--secondary);
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 300px;
            outline: none;
        }

        .btn {
            font-size: 1.5rem;
            padding: 15px 30px;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 6px 0 #c0392b;
            margin: 10px;
            font-weight: bold;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #c0392b;
        }
        
        .btn-secondary {
            background-color: var(--secondary);
            box-shadow: 0 6px 0 #007a70;
        }
        .btn-secondary:active {
            box-shadow: 0 0 0 #007a70;
        }

        .status-text {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #666;
        }

        /* Lobby */
        #room-list {
            width: 100%;
            max-width: 500px;
            max-height: 50vh;
            overflow-y: auto;
            margin-top: 20px;
            border-radius: 10px;
            background: var(--white);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 10px;
        }

        .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 2px solid #eee;
            font-size: 1.2rem;
        }

        .room-item:last-child {
            border-bottom: none;
        }
        
        .join-btn {
            font-size: 1rem;
            padding: 10px 20px;
            box-shadow: 0 4px 0 #007a70;
            margin: 0;
        }

        /* Battle */
        #battle-screen {
            flex-direction: row;
            justify-content: space-between;
            padding: 10px;
            background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 100%);
        }

        .player-panel {
            width: 25%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.8);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .player-animal {
            font-size: 5rem;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }

        .player-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            word-break: break-all;
            text-align: center;
        }

        .hp-bar-container {
            width: 100%;
            height: 30px;
            background: #ddd;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 5px;
            border: 3px solid #fff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .hp-bar {
            height: 100%;
            background: var(--hp-green);
            width: 100%;
            transition: width 0.3s ease, background-color 0.3s;
        }

        .hp-text {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .score-text {
            font-size: 1.2rem;
            color: #34495e;
            margin-top: 10px;
            font-weight: bold;
        }

        .center-arena {
            width: 48%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .question-box {
            background: var(--white);
            border-radius: 15px;
            padding: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            min-height: 30%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--primary);
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            height: 65%;
        }

        .ans-btn {
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 15px;
            border: none;
            background: var(--white);
            color: var(--text-main);
            box-shadow: 0 6px 0 #ccc;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .ans-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #ccc;
        }
        
        /* Animations */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .anim-shake { animation: shake 0.5s; }
        .anim-attack { transform: scale(1.3) translateX(20px); }
        .anim-attack-right { transform: scale(1.3) translateX(-20px); }

        #action-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            transition: opacity 0.2s, transform 0.2s;
        }

        /* Toast / Messages */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.2rem;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        /* Overlays */
        #orientation-warning {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #333; color: white;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
        }
        @media (orientation: portrait) {
            #orientation-warning { display: flex; }
        }
        
        .overlay-screen {
            position: fixed;
            top:0; left:0; width:100vw; height:100vh;
            background: rgba(0,0,0,0.9);
            color: white;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .overlay-screen.active { display: flex; }

        .big-emoji { font-size: 6rem; margin-bottom: 20px; }
        .result-title { font-size: 3rem; margin-bottom: 20px; color: #f1c40f; }
    </style>
</head>
<body>

    <div id="author-tag">蜥蜴老師設計</div>
    <div id="orientation-warning">
        <div style="font-size:5rem; margin-bottom:20px;">↻</div>
        請將手機橫向以進行對戰
    </div>

    <div id="toast">訊息</div>
    <div id="action-overlay">答對！</div>

    <!-- 首頁登入 -->
    <div id="login-screen" class="screen active">
        <h1>🩸 循環系統大決戰！</h1>
        <p style="font-size:1.2rem; margin-bottom:20px;">探索人體運輸網路的奧秘</p>
        <input type="text" id="nickname-input" class="input-box" placeholder="請輸入暱稱 (1-20字)" maxlength="20">
        <button class="btn" onclick="enterLobby()">進入大廳</button>
        <div id="db-status" class="status-text">連線中...</div>
    </div>

    <!-- 大廳 -->
    <div id="lobby-screen" class="screen">
        <h1>遊戲大廳</h1>
        <p class="status-text" id="lobby-greeting"></p>
        <button class="btn" onclick="createRoom()">➕ 建立房間</button>
        <div id="room-list">
            <!-- 房間列表由 JS 產生 -->
        </div>
    </div>

    <!-- 等待中 -->
    <div id="waiting-screen" class="screen">
        <div class="big-emoji">⏳</div>
        <h1>等待對手加入...</h1>
        <button class="btn btn-secondary" onclick="cancelRoom()">取消房間</button>
    </div>

    <!-- 對戰畫面 -->
    <div id="battle-screen" class="screen">
        <!-- 左側：我方 -->
        <div class="player-panel" id="me-panel">
            <div class="player-animal" id="me-animal">🐱</div>
            <div class="player-name" id="me-name">我方暱稱</div>
            <div class="hp-bar-container">
                <div class="hp-bar" id="me-hp-bar"></div>
            </div>
            <div class="hp-text">HP: <span id="me-hp-text">7</span></div>
            <div class="score-text">分數: <span id="me-score">0</span></div>
        </div>

        <!-- 中間：題目 -->
        <div class="center-arena">
            <div class="question-box" id="question-text">題目載入中...</div>
            <div class="answers-grid">
                <button class="ans-btn" onclick="submitAnswer(0)" id="ans-0">A</button>
                <button class="ans-btn" onclick="submitAnswer(1)" id="ans-1">B</button>
                <button class="ans-btn" onclick="submitAnswer(2)" id="ans-2">C</button>
                <button class="ans-btn" onclick="submitAnswer(3)" id="ans-3">D</button>
            </div>
        </div>

        <!-- 右側：對手 -->
        <div class="player-panel" id="opp-panel">
            <div class="player-animal" id="opp-animal">🐶</div>
            <div class="player-name" id="opp-name">等待對手...</div>
            <div class="hp-bar-container">
                <div class="hp-bar" id="opp-hp-bar"></div>
            </div>
            <div class="hp-text">HP: <span id="opp-hp-text">7</span></div>
            <div class="score-text">分數: <span id="opp-score">0</span></div>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="overlay-screen">
        <div class="big-emoji" id="result-emoji">🏆</div>
        <div class="result-title" id="result-title">勝利！</div>
        <p id="result-desc" style="font-size:1.5rem; margin-bottom:30px;">太棒了，你完全掌握了循環系統的奧秘！</p>
        <button class="btn" onclick="backToLobby()">回到遊戲大廳</button>
    </div>

    <!-- 斷線提示 -->
    <div id="disconnect-overlay" class="overlay-screen">
        <div class="big-emoji">🔌</div>
        <div class="result-title" style="color:#e74c3c;">對手已斷線</div>
        <p style="font-size:1.5rem; margin-bottom:30px;">對方似乎離開了教室網路</p>
        <button class="btn" onclick="backToLobby()">回到遊戲大廳</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ==========================================
        // 1. Supabase 初始化 (使用老師提供的 URL & Key)
        // ==========================================
        const SUPABASE_URL = 'https://djnlztioaoxumvuqxqkb.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_v-dzOhY1JfbObwxIGLsGBA_LTlDEDgd';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        // ==========================================
        // 2. 生物學科題目庫 (循環系統 20題以上)
        // ==========================================
        const QUESTION_BANK = [
            { q: "心臟分為幾個腔室？", opts: ["2個", "3個", "4個", "5個"], a: 2 },
            { q: "哪種血管負責將『充氧血』從心臟送往全身？", opts: ["動脈", "靜脈", "微血管", "淋巴管"], a: 0 },
            { q: "血液中負責運送氧氣的細胞是？", opts: ["白血球", "紅血球", "血小板", "血漿"], a: 1 },
            { q: "負責抵抗外來病原體的血球是？", opts: ["紅血球", "血小板", "白血球", "巨噬細胞"], a: 2 },
            { q: "血液中幫助受傷部位凝血的成分是？", opts: ["血小板", "紅血球", "白血球", "抗體"], a: 0 },
            { q: "連接動脈與靜脈，且管壁最薄、進行物質交換的血管是？", opts: ["大動脈", "微血管", "大靜脈", "小靜脈"], a: 1 },
            { q: "正常國中生的心跳一分鐘大約是幾次？", opts: ["30-50次", "60-80次", "100-120次", "140-160次"], a: 1 },
            { q: "將『缺氧血』從身體各部位送回心臟的血管是？", opts: ["動脈", "微血管", "靜脈", "淋巴管"], a: 2 },
            { q: "哪一個生活習慣對心血管系統『有益』？", opts: ["長期熬夜", "每天喝含糖飲料", "規律運動", "攝取高鹽食物"], a: 2 },
            { q: "靜脈內有何種特殊構造可防止血液倒流？", opts: ["平滑肌", "瓣膜", "微絲", "彈性纖維"], a: 1 },
            { q: "右心室收縮時，會將缺氧血送到哪裡進行氣體交換？", opts: ["肺動脈", "主動脈", "上腔靜脈", "左心房"], a: 0 },
            { q: "人體的血液循環可分為體循環與什麼？", opts: ["腦循環", "肺循環", "肝循環", "腎循環"], a: 1 },
            { q: "肺循環的主要目的是？", opts: ["運送養分", "將充氧血變缺氧血", "將缺氧血變成充氧血", "過濾毒素"], a: 2 },
            { q: "左心室的管壁比右心室厚，主要是因為？", opts: ["左心室比較小", "需將血液送至全身", "為了儲存更多血液", "天生畸形"], a: 1 },
            { q: "構成血液中液體部分，主要負責運送養分與廢物的是？", opts: ["血漿", "紅血球", "白血球", "血小板"], a: 0 },
            { q: "長期攝取過多高油脂食物容易導致？", opts: ["心臟變大", "血管阻塞", "血壓過低", "血液變清澈"], a: 1 },
            { q: "測量脈搏時，我們通常是觸摸哪一種血管？", opts: ["靜脈", "微血管", "淋巴管", "動脈"], a: 3 },
            { q: "從肺部流回心臟的血液是？", opts: ["缺氧血", "充氧血", "混合血", "組織液"], a: 1 },
            { q: "我們常說的『血壓』，通常是指血液對哪種血管壁產生的壓力？", opts: ["動脈", "靜脈", "微血管", "淋巴管"], a: 0 },
            { q: "捐血或抽血檢查時，醫護人員通常是抽取哪一種血管的血液？", opts: ["動脈", "微血管", "靜脈", "主動脈"], a: 2 },
            { q: "心臟本身所需的氧氣與養分，是藉由哪一條血管供應？", opts: ["肺動脈", "冠狀動脈", "上下腔靜脈", "頸動脈"], a: 1 },
            { q: "當我們運動時，心跳會加快，主要目的是？", opts: ["讓身體發熱", "更快排出二氧化碳並獲得氧氣", "減少血液流動", "降低血壓"], a: 1 }
        ];

        const ANIMALS = ['🐱','🐶','🐰','🐻','🦊','🐼','🐧','🐸'];

        // ==========================================
        // 3. 遊戲狀態變數
        // ==========================================
        let clientToken = localStorage.getItem('sequence_battle_client_token');
        if (!clientToken) {
            clientToken = crypto.randomUUID();
            localStorage.setItem('sequence_battle_client_token', clientToken);
        }

        let nickname = "";
        let currentRoomId = null;
        let currentSeat = null;
        
        let lobbyChannel = null;
        let gameChannel = null;
        
        let heartbeatTimer = null;
        let disconnectTimer = null;
        let opponentWasPresent = false;
        
        let latestGameState = null;
        let lastProcessedEventId = null;
        let currentQuestionObj = null;
        let isAnswering = false;

        // ==========================================
        // 4. 共用語音與工具函數
        // ==========================================
        function showScreen(screenId) {
            document.querySelectorAll('.screen, .overlay-screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = 1;
            setTimeout(() => { toast.style.opacity = 0; }, 3000);
        }

        function getDeterministicAnimal(roomId, seat) {
            let sum = 0;
            for(let i=0; i<roomId.length; i++) sum += roomId.charCodeAt(i);
            const index = (sum + seat) % ANIMALS.length;
            return ANIMALS[index];
        }

        // ==========================================
        // 5. 首頁與連線檢查
        // ==========================================
        window.onload = async () => {
            try {
                // 測試資料庫連線
                const { error } = await supabase.from('rooms').select('id').limit(1);
                if (error) throw error;
                document.getElementById('db-status').innerText = "✅ 資料庫已連接";
                document.getElementById('db-status').style.color = "var(--hp-green)";
            } catch (err) {
                document.getElementById('db-status').innerText = "❌ 資料庫連線失敗";
                document.getElementById('db-status').style.color = "var(--hp-red)";
                console.error(err);
            }
        };

        function enterLobby() {
            const input = document.getElementById('nickname-input').value.trim();
            if (input.length < 1 || input.length > 20) {
                showToast('請輸入 1~20 個字的暱稱');
                return;
            }
            nickname = input;
            document.getElementById('lobby-greeting').innerText = `你好，${nickname}！準備好對戰了嗎？`;
            showScreen('lobby-screen');
            initLobby();
        }

        // ==========================================
        // 6. Lobby 大廳功能
        // ==========================================
        async function initLobby() {
            await fetchLiveRooms();
            
            if (!lobbyChannel) {
                lobbyChannel = supabase.channel('public:rooms')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, payload => {
                        fetchLiveRooms();
                    })
                    .subscribe();
            }
        }

        async function fetchLiveRooms() {
            if (currentRoomId) return; // 如果已經在房間內就不更新大廳
            try {
                const { data, error } = await supabase.rpc('list_live_rooms');
                if (error) throw error;
                
                const listEl = document.getElementById('room-list');
                listEl.innerHTML = '';
                
                if (!data || data.length === 0) {
                    listEl.innerHTML = '<div class="room-item" style="justify-content:center; color:#888;">目前沒有等待中的房間</div>';
                    return;
                }
                
                data.forEach(room => {
                    const div = document.createElement('div');
                    div.className = 'room-item';
                    div.innerHTML = `
                        <span>房主：<b>${room.host_nickname}</b></span>
                        <button class="btn join-btn" onclick="tryJoinRoom('${room.room_id}')">⚔️ 加入對戰</button>
                    `;
                    listEl.appendChild(div);
                });
            } catch (err) {
                console.error('Fetch rooms error:', err);
            }
        }

        // ==========================================
        // 7. 建立房間與 Heartbeat
        // ==========================================
        async function createRoom() {
            try {
                const { data, error } = await supabase.rpc('create_room', {
                    p_nickname: nickname,
                    p_client_token: clientToken
                });
                if (error) throw error;
                
                currentRoomId = data.room_id;
                currentSeat = 1;
                showScreen('waiting-screen');
                
                startHeartbeat();
                setupGameChannelAndPresence();
                
            } catch (err) {
                showToast('建立房間失敗：' + err.message);
            }
        }

        function startHeartbeat() {
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            heartbeatTimer = setInterval(async () => {
                if (!currentRoomId || currentSeat !== 1) return;
                try {
                    await supabase.rpc('heartbeat_room', {
                        p_room_id: currentRoomId,
                        p_client_token: clientToken
                    });
                } catch (err) {
                    console.error('Heartbeat failed:', err);
                }
            }, 3000);
        }

        async function cancelRoom() {
            if (!currentRoomId || currentSeat !== 1) return;
            try {
                await supabase.rpc('cancel_room', {
                    p_room_id: currentRoomId,
                    p_client_token: clientToken
                });
            } catch(err) {
                console.error(err);
            }
            backToLobby();
        }

        // 當房主直接關閉頁面時，嘗試送出 cancel_room
        window.addEventListener('pagehide', () => {
            if (currentRoomId && currentSeat === 1) {
                const body = JSON.stringify({ p_room_id: currentRoomId, p_client_token: clientToken });
                // 使用 REST API 直接呼叫 RPC 以便在 pagehide 運作
                fetch(`${SUPABASE_URL}/rest/v1/rpc/cancel_room`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_PUBLISHABLE_KEY,
                        'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
                    },
                    body: body,
                    keepalive: true
                });
            }
        });

        // ==========================================
        // 8. 加入房間 (Join Probe 手機機制)
        // ==========================================
        async function tryJoinRoom(roomId) {
            showToast('連線中...');
            const probeId = crypto.randomUUID();
            let hostAcked = false;
            
            // 暫時建立頻道發送 probe
            const probeChannel = supabase.channel(`game-${roomId}`);
            
            probeChannel.on('broadcast', { event: 'host_ack' }, (payload) => {
                if (payload.payload.probe_id === probeId) {
                    hostAcked = true;
                }
            }).subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    probeChannel.send({
                        type: 'broadcast',
                        event: 'join_probe',
                        payload: { probe_id: probeId }
                    });
                    
                    setTimeout(async () => {
                        supabase.removeChannel(probeChannel);
                        if (hostAcked) {
                            executeJoin(roomId);
                        } else {
                            showToast('房主已離開，請選其他房間。');
                            fetchLiveRooms();
                        }
                    }, 2000);
                }
            });
        }

        async function executeJoin(roomId) {
            try {
                const { data, error } = await supabase.rpc('join_room', {
                    p_room_id: roomId,
                    p_nickname: nickname,
                    p_client_token: clientToken
                });
                
                if (error) {
                    if (error.message.includes('HOST_OFFLINE')) {
                        showToast('房主已離開，請選其他房間。');
                    } else if (error.message.includes('ROOM_ALREADY_FULL')) {
                        showToast('房間已滿！');
                    } else {
                        showToast('加入失敗：' + error.message);
                    }
                    return;
                }
                
                currentRoomId = roomId;
                currentSeat = 2;
                setupGameChannelAndPresence();
                
            } catch (err) {
                showToast('網路錯誤：' + err.message);
            }
        }

        // ==========================================
        // 9. Realtime & Presence & Game State
        // ==========================================
        function setupGameChannelAndPresence() {
            if (gameChannel) supabase.removeChannel(gameChannel);
            
            gameChannel = supabase.channel(`game-${currentRoomId}`, {
                config: { presence: { key: clientToken } }
            });

            // 處理廣播 (房主回應 probe)
            gameChannel.on('broadcast', { event: 'join_probe' }, (payload) => {
                if (currentSeat === 1) {
                    gameChannel.send({
                        type: 'broadcast',
                        event: 'host_ack',
                        payload: { probe_id: payload.payload.probe_id }
                    });
                }
            });

            // 監聽 Presence 斷線
            gameChannel.on('presence', 'sync', () => {
                const state = gameChannel.presenceState();
                const oppSeat = currentSeat === 1 ? 2 : 1;
                let oppFound = false;
                
                for (const id in state) {
                    state[id].forEach(p => {
                        if (p.seat === oppSeat) oppFound = true;
                    });
                }
                
                if (oppFound) {
                    opponentWasPresent = true;
                    if (disconnectTimer) {
                        clearTimeout(disconnectTimer);
                        disconnectTimer = null;
                    }
                    document.getElementById('disconnect-overlay').classList.remove('active');
                } else if (opponentWasPresent && latestGameState?.status === 'playing') {
                    // 對手消失且遊戲在進行中
                    if (!disconnectTimer) {
                        disconnectTimer = setTimeout(() => {
                            document.getElementById('disconnect-overlay').classList.add('active');
                        }, 5000);
                    }
                }
            });

            // 監聽 game_state
            gameChannel.on('postgres_changes', { 
                event: '*', 
                schema: 'public', 
                table: 'game_state',
                filter: `room_id=eq.${currentRoomId}`
            }, payload => {
                latestGameState = payload.new;
                updateBattleUI();
            });

            gameChannel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await gameChannel.track({
                        nickname: nickname,
                        seat: currentSeat
                    });
                }
            });
            
            // 手動拉取初始 game_state
            fetchGameState();
        }

        async function fetchGameState() {
            const { data } = await supabase.from('game_state').select('*').eq('room_id', currentRoomId).single();
            if (data) {
                latestGameState = data;
                updateBattleUI();
            }
        }

        // ==========================================
        // 10. 戰鬥畫面與邏輯
        // ==========================================
        function updateBattleUI() {
            if (!latestGameState) return;

            if (latestGameState.status === 'playing' && document.getElementById('battle-screen').className.indexOf('active') === -1) {
                // 從 waiting 轉為 playing
                if (heartbeatTimer) clearInterval(heartbeatTimer);
                showScreen('battle-screen');
                initBattle();
            }

            if (latestGameState.status === 'playing') {
                const me = currentSeat === 1 ? {
                    hp: latestGameState.player1_hp, 
                    score: latestGameState.player1_score,
                    name: latestGameState.player1_name
                } : {
                    hp: latestGameState.player2_hp, 
                    score: latestGameState.player2_score,
                    name: latestGameState.player2_name
                };

                const opp = currentSeat === 1 ? {
                    hp: latestGameState.player2_hp, 
                    score: latestGameState.player2_score,
                    name: latestGameState.player2_name
                } : {
                    hp: latestGameState.player1_hp, 
                    score: latestGameState.player1_score,
                    name: latestGameState.player1_name
                };

                // 更新 HP 數字與 Bar
                document.getElementById('me-hp-text').innerText = me.hp;
                document.getElementById('me-score').innerText = me.score;
                document.getElementById('me-name').innerText = me.name;
                const meBar = document.getElementById('me-hp-bar');
                meBar.style.width = Math.max(0, (me.hp / 7) * 100) + '%';
                meBar.style.backgroundColor = me.hp > 3 ? 'var(--hp-green)' : 'var(--hp-red)';

                document.getElementById('opp-hp-text').innerText = opp.hp;
                document.getElementById('opp-score').innerText = opp.score;
                document.getElementById('opp-name').innerText = opp.name || '等待中...';
                const oppBar = document.getElementById('opp-hp-bar');
                oppBar.style.width = Math.max(0, (opp.hp / 7) * 100) + '%';
                oppBar.style.backgroundColor = opp.hp > 3 ? 'var(--hp-green)' : 'var(--hp-red)';

                // 處理事件動畫
                if (latestGameState.last_event_id && latestGameState.last_event_id !== lastProcessedEventId) {
                    lastProcessedEventId = latestGameState.last_event_id;
                    const eventSeat = latestGameState.last_event_seat;
                    const type = latestGameState.last_event_type;
                    
                    if (eventSeat === currentSeat) {
                        // 我方動作
                        if (type === 'hit') showActionAnimation('答對！', 'var(--hp-green)', 'me-animal', 'anim-attack');
                        else showActionAnimation('答錯扣血', 'var(--hp-red)', 'me-animal', 'anim-shake');
                    } else {
                        // 對方動作
                        if (type === 'hit') showActionAnimation('對手攻擊！', 'var(--hp-red)', 'opp-animal', 'anim-attack-right');
                        else showActionAnimation('對手失誤', 'gray', 'opp-animal', 'anim-shake');
                    }
                }
            }

            // 遊戲結束
            if (latestGameState.status === 'finished') {
                showResult();
            }
        }

        function initBattle() {
            isAnswering = false;
            document.getElementById('me-animal').innerText = getDeterministicAnimal(currentRoomId, currentSeat);
            document.getElementById('opp-animal').innerText = getDeterministicAnimal(currentRoomId, currentSeat === 1 ? 2 : 1);
            generateQuestion();
        }

        function generateQuestion() {
            // 隨機挑選一題
            const qIdx = Math.floor(Math.random() * QUESTION_BANK.length);
            const qData = QUESTION_BANK[qIdx];
            
            // 重新排列選項
            const indices = [0,1,2,3].sort(() => Math.random() - 0.5);
            
            currentQuestionObj = {
                text: qData.q,
                options: indices.map(i => qData.opts[i]),
                correctIndex: indices.indexOf(qData.a)
            };

            document.getElementById('question-text').innerText = currentQuestionObj.text;
            for(let i=0; i<4; i++) {
                const btn = document.getElementById(`ans-${i}`);
                btn.innerText = currentQuestionObj.options[i];
                btn.style.backgroundColor = "var(--white)";
                btn.style.color = "var(--text-main)";
            }
            isAnswering = false;
        }

        async function submitAnswer(btnIndex) {
            if (isAnswering || latestGameState?.status !== 'playing') return;
            isAnswering = true;

            const isCorrect = (btnIndex === currentQuestionObj.correctIndex);
            
            // UI 回饋
            const btn = document.getElementById(`ans-${btnIndex}`);
            btn.style.backgroundColor = isCorrect ? 'var(--hp-green)' : 'var(--hp-red)';
            btn.style.color = "var(--white)";
            
            if (!isCorrect) {
                // 標示正確答案
                document.getElementById(`ans-${currentQuestionObj.correctIndex}`).style.backgroundColor = "var(--hp-green)";
                document.getElementById(`ans-${currentQuestionObj.correctIndex}`).style.color = "var(--white)";
            }

            try {
                await supabase.rpc('resolve_answer', {
                    p_room_id: currentRoomId,
                    p_client_token: clientToken,
                    p_is_correct: isCorrect
                });
                
                // 停頓 1.5 秒換題
                setTimeout(() => {
                    if (latestGameState?.status === 'playing') {
                        generateQuestion();
                    }
                }, 1500);

            } catch(err) {
                console.error(err);
                isAnswering = false;
            }
        }

        function showActionAnimation(text, color, targetId, animClass) {
            // 文字特效
            const overlay = document.getElementById('action-overlay');
            overlay.innerText = text;
            overlay.style.color = color;
            overlay.style.opacity = 1;
            overlay.style.transform = "translate(-50%, -50%) scale(1.2)";
            
            setTimeout(() => {
                overlay.style.opacity = 0;
                overlay.style.transform = "translate(-50%, -50%) scale(1)";
            }, 800);

            // 動物動畫
            const target = document.getElementById(targetId);
            if (target) {
                target.classList.add(animClass);
                setTimeout(() => target.classList.remove(animClass), 500);
            }
        }

        // ==========================================
        // 11. 結算與清理
        // ==========================================
        function showResult() {
            const isWinner = latestGameState.winner_seat === currentSeat;
            const emojiEl = document.getElementById('result-emoji');
            const titleEl = document.getElementById('result-title');
            const descEl = document.getElementById('result-desc');

            if (isWinner) {
                emojiEl.innerText = "🏆";
                titleEl.innerText = "勝利！";
                titleEl.style.color = "#f1c40f";
                descEl.innerText = "太棒了，你完全掌握了循環系統的奧秘！";
            } else {
                emojiEl.innerText = "💔";
                titleEl.innerText = "落敗";
                titleEl.style.color = "var(--hp-red)";
                descEl.innerText = "差一點點，再接再厲！";
            }
            document.getElementById('result-screen').classList.add('active');
        }

        function backToLobby() {
            // 清理機制
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            if (disconnectTimer) clearTimeout(disconnectTimer);
            if (gameChannel) supabase.removeChannel(gameChannel);
            
            currentRoomId = null;
            currentSeat = null;
            latestGameState = null;
            opponentWasPresent = false;
            
            // 恢復 UI
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('disconnect-overlay').classList.remove('active');
            
            showScreen('lobby-screen');
            initLobby();
        }
    </script>
</body>
</html>
